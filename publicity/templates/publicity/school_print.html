<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>中学校印刷用一覧</title>

    <style>
        body {
            font-family: "Yu Gothic", "Meiryo", sans-serif;
            margin: 20px;
            color: #000;
        }

        h1 {
            text-align: center;
            font-size: 22px;
            margin-bottom: 20px;
        }

        .print-button {
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
        }

        th, td {
            border: 1px solid #000;
            padding: 5px;
            vertical-align: middle;
        }

        th {
            background-color: #f0f0f0;
            text-align: center;
        }

        .number {
            width: 35px;
            text-align: center;
        }

        .school-name {
            width: 180px;
        }

        .city {
            width: 70px;
            text-align: center;
        }

        .principal {
            width: 80px;
            text-align: center;
        }

        .tel {
            width: 90px;
            text-align: center;
        }

        .total {
            width: 55px;
            text-align: center;
        }

        @media print {
            .print-button {
                display: none;
            }

            body {
                margin: 10mm;
            }

            @page {
                size: A4 landscape;
                margin: 10mm;
            }
        }
    </style>
</head>
<body>

    <div class="print-button">
        <button onclick="window.print()">印刷する</button>
    </div>

    <h1>中学校情報一覧</h1>

    <table>
        <tr>
            <th class="number">No</th>
            <th class="school-name">学校名</th>
            <th class="city">市町村</th>
            <th class="principal">校長</th>
            <th class="tel">電話番号</th>
            <th>住所</th>
            <th class="total">3年合計</th>
        </tr>

        {% for school in schools %}
        <tr>
            <td class="number">{{ school.number }}</td>
            <td class="school-name">{{ school.name }}</td>
            <td class="city">{{ school.city }}</td>
            <td class="principal">{{ school.principal_name }}</td>
            <td class="tel">{{ school.tel }}</td>
            <td>{{ school.address }}</td>
            <td class="total">{{ school.third_grade_total }}</td>
        </tr>
        {% endfor %}
    </table>

</body>
</html>
